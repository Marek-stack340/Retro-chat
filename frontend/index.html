<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ODDYCH CHAT</title>
  <meta name="description" content="Oddych chat — jednoduchý retro chat." />
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <main class="chat-wrapper">
      <header class="header">
        <div class="header-title">
          <h1>ODDYCH CHAT</h1>
          <div class="status-light"></div>
        </div>
        <div class="user-actions">
          <span id="username-display" class="username-tag">CONNECT</span>
          <span id="user-count">Users: 0</span>
        </div>
      </header>

      <!-- Join modal -->
      <div id="join-modal" class="modal active">
        <div class="modal-content">
          <h2>Vitaj v Oddych chate</h2>
          <input id="username-input" type="text" placeholder="Zadaj meno" maxlength="20">
          <div style="margin-top:12px;display:flex;gap:10px;">
            <button id="join-btn" class="retro-button">ENTER CHAT</button>
            <button id="open-register-btn" class="retro-button" style="background:transparent;color:var(--primary-color);border:1px solid var(--primary-color);">REGISTER</button>
          </div>
          <p class="help-text">ESC TO QUIT | ENTER TO SEND | .vymaz TO CLEAR</p>
        </div>
      </div>

      <!-- Register modal -->
      <div id="register-modal" class="modal hidden">
        <div class="modal-content">
          <h2>REGISTER</h2>
          <input id="register-username" type="text" placeholder="USERNAME" maxlength="20">
          <input id="register-email" type="email" placeholder="EMAIL">
          <input id="register-password" type="password" placeholder="PASSWORD">
          <div id="register-status" class="register-status"></div>
          <div style="margin-top:8px;display:flex;gap:8px;">
            <button id="register-btn" class="retro-button">REGISTER</button>
            <button id="close-register-btn" class="retro-button" style="background:transparent;color:var(--primary-color);border:1px solid var(--border-color);">CLOSE</button>
          </div>
        </div>
      </div>

      <!-- Chat area -->
      <div id="chat-container" class="chat-container hidden">
        <aside class="users-list-sidebar">
          <h3>CONNECTED USERS</h3>
          <ul id="users-list" class="users-list"></ul>
        </aside>
        <section class="messages-wrapper">
          <div id="messages" class="messages"></div>
          <div id="typing-indicator" class="typing-indicator hidden"><span id="typing-user"></span> is typing...</div>
        </section>
      </div>

      <!-- Input area -->
      <div id="input-area" class="input-area hidden">
        <div class="input-wrapper">
          <input id="message-input" type="text" placeholder="TYPE YOUR MESSAGE..." disabled>
          <button id="send-btn" class="retro-button send-btn" disabled>SEND</button>
        </div>
      </div>

      <footer class="footer">:: ODDYCH CHAT ::</footer>
    </main>
  </div>

  <!-- Hidden odkazovac and call elements (kept for client.js) -->
  <div id="odkazovac-modal" class="modal hidden">
    <div class="modal-content" style="max-width:560px;">
      <h2 id="odkazovac-title">ODKAZOVAČ</h2>
      <div id="odkazovac-warning" class="system-message hidden"></div>
      <p id="odkazovac-recipient"></p>
      <ul id="odkazovac-user-list"></ul>
      <div id="odkazovac-messages"></div>
      <input id="odkazovac-input" type="text">
      <button id="odkazovac-send" class="retro-button">POŠLIŤ</button>
      <button id="odkazovac-close" class="retro-button">ZAVRIEŤ</button>
    </div>
  </div>

  <div id="call-modal" class="modal hidden">
    <div class="modal-content">
      <h2 id="call-title">Hovor</h2>
      <video id="remoteVideo" autoplay playsinline></video>
      <video id="localVideo" autoplay muted playsinline></video>
      <button id="call-hangup" class="retro-button">Hangup</button>
      <button id="call-mute" class="retro-button">Mute</button>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <script src="client.js"></script>
</body>
</html>
