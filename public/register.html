<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Registrácia - Oddych Chat</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="app hero">
      <header><h1>Registrácia</h1></header>
      <main>
        <p class="hero-text">Zadaj svoje meno a e-mail pre rýchlu prípravu do chatu.</p>
        <form id="register-form" class="register-form">
          <input id="reg-username" type="text" placeholder="Tvoje meno" maxlength="20" required />
          <input id="reg-password" type="password" placeholder="Tvoje heslo" minlength="4" required />
          <input id="reg-email" type="email" placeholder="Tvoj e-mail" required />
          <button class="button-large" type="submit">Uložiť</button>
        </form>
        <p class="hero-text secondary">Po registrácii bude meno automaticky dostupné pri vstupe do chatu.</p>
        <a class="button-secondary" href="/chat.html">Vstúpiť do chatu</a>
      </main>
    </div>
    <script>
      const form = document.getElementById('register-form');
      const usernameField = document.getElementById('reg-username');
      const passwordField = document.getElementById('reg-password');
      const emailField = document.getElementById('reg-email');

      const savedUsername = localStorage.getItem('chatUsername');
      if (savedUsername) {
        usernameField.value = savedUsername;
      }

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const username = usernameField.value.trim();
        const password = passwordField.value.trim();
        const email = emailField.value.trim();
        if (!username) {
          alert('Zadaj meno.');
          return;
        }
        if (!password) {
          alert('Zadaj heslo.');
          return;
        }
        if (!email) {
          alert('Zadaj e-mail.');
          return;
        }
        fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, email })
        })
          .then(async (response) => {
            const payload = await response.json().catch(() => ({}));
            if (!response.ok || !payload.ok) {
              throw new Error(payload.message || 'Registrácia zlyhala.');
            }
            localStorage.setItem('chatUsername', username);
            localStorage.setItem('chatRegistered', 'true');
            alert('Účet uložený. Teraz sa môžeš prihlásiť.');
            window.location.href = '/';
          })
          .catch((error) => {
            alert(error.message || 'Registrácia zlyhala.');
          });
      });
    </script>
  </body>
</html>
