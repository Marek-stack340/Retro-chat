<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Oddych Chat</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="page-wrap">
      <header class="landing-topbar">
        <div class="brand-left">🙂</div>
        <div class="brand-title">oddych chat</div>
        <div class="brand-right">1999 — 2026</div>
      </header>

      <div class="landing-grid">
        <aside class="panel panel-left">
          <div class="panel-header">Najaktívnejší chateri</div>
          <ol class="chat-list"></ol>
        </aside>

        <main class="main-panel">
          <section class="entry-section">
            <div class="section-title">Vstup</div>
            <form id="login-form" class="entry-form">
              <div class="form-row">
                <label for="login-nick">Nick:</label>
                <input id="login-nick" type="text" placeholder="Marekc" />
              </div>
              <div class="form-row">
                <label for="login-pass">Heslo (iba registrovaní):</label>
                <input id="login-pass" type="password" placeholder="●●●●●" />
              </div>
              <div class="form-row">
                <label for="login-room">Miestnosť (ľudí):</label>
                <select id="login-room">
                  <option>Spoločná (1)</option>
                  <option>Retro (0)</option>
                  <option>Slovensko (0)</option>
                </select>
              </div>
              <div class="form-actions">
                <button id="login-submit" type="submit" class="button-enter">Vstúpiť</button>
              </div>
            </form>
            <div class="entry-links">
              <a href="/register.html">Registrácia nicku</a> / <a href="#">Zabudol som heslo</a>
            </div>
          </section>

          <section class="info-section">
            <div class="section-title">Kedy sem prísť?</div>
            <div class="times-row">
              <div class="time-entry active" data-hour="9">9:00</div>
              <div class="time-entry" data-hour="15">15:00</div>
              <div class="time-entry" data-hour="19">19:00</div>
            </div>
            <div class="time-note">Najbližší: <span id="next-time-label">9:00</span></div>
          </section>

        </main>

        <aside class="panel panel-right">
          <div class="panel-header">Najobľúbenejší chateri</div>
          <ol class="chat-list favorites"></ol>
          <div class="panel-note">Najobľúbenejších označilo najviac ľudí za priateľov.</div>
        </aside>
      </div>
    </div>

    <script>
      const nickInput = document.getElementById('login-nick');
      const loginForm = document.getElementById('login-form');
      const nextTimeLabel = document.getElementById('next-time-label');
      const timeEntries = Array.from(document.querySelectorAll('.time-entry'));
      const savedNick = localStorage.getItem('chatUsername');
      if (savedNick) nickInput.value = savedNick;

      function getNextTime() {
        const now = new Date();
        const schedule = [9, 15, 19];
        const currentHour = now.getHours();
        const currentMinute = now.getMinutes();
        const currentTotal = currentHour * 60 + currentMinute;
        const times = schedule.map((hour) => hour * 60);

        if (currentTotal < times[0]) {
          return schedule[0];
        }
        if (currentTotal < times[1] || currentTotal === times[0]) {
          return schedule[1];
        }
        if (currentTotal < times[2] || currentTotal === times[1]) {
          return schedule[2];
        }
        return schedule[0];
      }

      function updateScheduleHighlight() {
        const nextHour = getNextTime();
        const nextValue = `${String(nextHour).padStart(2, '0')}:00`;
        nextTimeLabel.textContent = nextValue;
        timeEntries.forEach((entry) => {
          const hour = Number(entry.dataset.hour);
          entry.classList.toggle('active', hour === nextHour);
        });
      }

      function submitLogin() {
        const nick = nickInput.value.trim() || 'Anon';
        localStorage.setItem('chatUsername', nick);
        window.location.href = '/chat.html';
      }

      loginForm.addEventListener('submit', (event) => {
        event.preventDefault();
        submitLogin();
      });

      updateScheduleHighlight();
      setInterval(updateScheduleHighlight, 60 * 1000);
    </script>
  </body>
</html>
