<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Oddych Meet</title>
  <link rel="stylesheet" href="meet.css">
</head>
<body>

  <!-- LOBBY -->
  <div id="lobby" class="screen">
    <div class="lobby-card">
      <div class="meet-logo">📹 Oddych Meet</div>
      <p class="meet-sub">Video hovory priamo z chatu</p>

      <div class="form-group">
        <label>Tvoje meno</label>
        <input id="display-name" type="text" placeholder="Meno..." maxlength="30">
      </div>
      <div class="form-group">
        <label>Kód stretnutia</label>
        <input id="room-code" type="text" placeholder="napr. abc-123" maxlength="20">
      </div>

      <button id="join-btn" class="btn-primary">Pripojiť sa 🚀</button>
      <button id="new-meeting-btn" class="btn-secondary">Nové stretnutie</button>

      <a href="/chat.html" class="back-link">← Späť do chatu</a>
    </div>
  </div>

  <!-- MEETING ROOM -->
  <div id="meeting" class="screen hidden">
    <div class="meet-header">
      <div class="meet-header-left">
        <span class="meet-logo-small">📹</span>
        <span id="room-label" class="room-label"></span>
      </div>
      <div class="meet-header-right">
        <span id="participant-count" class="participant-count">1 účastník</span>
        <button id="copy-link-btn" class="btn-icon" title="Kopírovať link">🔗</button>
      </div>
    </div>

    <div id="videos-grid" class="videos-grid"></div>

    <div class="meet-controls">
      <button id="toggle-mic" class="ctrl-btn active" title="Mikrofón">🎤</button>
      <button id="toggle-cam" class="ctrl-btn active" title="Kamera">📷</button>
      <button id="leave-btn" class="ctrl-btn danger" title="Odísť">📵</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="meet-client.js"></script>
</body>
</html>
