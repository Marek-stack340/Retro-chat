<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#f3f7ff">
    <title>360Suite Analytics – Čavko chat</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/style.css">
  </head>
  <body class="landing-page-body">
    <div class="landing-shell-new">
      <header class="site-header">
        <div class="brand-lockup">
          <div class="brand-mark" aria-label="Logo Čavko chat">
            <svg class="brand-gmail-mark" viewBox="0 0 64 64" aria-hidden="true">
              <rect x="4" y="4" width="56" height="56" rx="16" fill="#d63a3a"/>
              <text x="32" y="36.5" text-anchor="middle" dominant-baseline="middle" font-size="26" font-weight="900" fill="#ffffff" font-family="Arial, Segoe UI, sans-serif" letter-spacing="-1">ČČ</text>
            </svg>
          </div>
          <div class="brand-copy">
            <strong>Čavko chat</strong>
          </div>
        </div>
        <nav class="top-nav" aria-label="Navigácia">
          <a href="/">Domov</a>
          <a href="/chat">Chat</a>
          <a href="/guestbook">Kniha návštev</a>
        </nav>
        <a class="mini-btn" href="/chat">Vstúpiť</a>
      </header>

      <main class="analytics-layout">
        <div class="analytics-topbar">
          <div>
            <p class="eyebrow-tight">360Suite Analytics</p>
            <h1>Marketing a návštevnosť</h1>
          </div>
          <button id="refresh-analytics" class="analytics-cta" type="button">Obnoviť dáta</button>
        </div>

        <section class="analytics-grid" aria-label="Zhrnutie návštevnosti">
          <article class="analytics-stat">
            <div class="kicker">Celkové zobrazenia</div>
            <strong id="total-views">0</strong>
          </article>
          <article class="analytics-stat">
            <div class="kicker">Unikátni návštevníci</div>
            <strong id="unique-visitors">0</strong>
          </article>
          <article class="analytics-stat">
            <div class="kicker">Dnešné návštevy</div>
            <strong id="today-views">0</strong>
          </article>
          <article class="analytics-stat">
            <div class="kicker">Dnešní návštevníci</div>
            <strong id="today-visitors">0</strong>
          </article>
        </section>

        <section class="analytics-panels">
          <article class="analytics-card">
            <h2>Top stránky</h2>
            <ul id="top-pages-list"></ul>
          </article>
          <article class="analytics-card">
            <h2>Zdroj návštevnosti</h2>
            <ul id="referrer-list"></ul>
          </article>
        </section>

        <section class="analytics-card" style="margin-top:18px;">
          <div class="analytics-metrics">
            <h2>Posledné aktivity</h2>
            <a class="analytics-cta" href="/">Späť na domov</a>
          </div>
          <ul id="recent-events-list"></ul>
        </section>
      </main>
    </div>

    <script>
      async function loadAnalyticsSummary() {
        try {
          const response = await fetch('/api/analytics/summary');
          const summary = await response.json();

          document.getElementById('total-views').textContent = summary.totalViews ?? 0;
          document.getElementById('unique-visitors').textContent = summary.uniqueVisitors ?? 0;
          document.getElementById('today-views').textContent = summary.todayViews ?? 0;
          document.getElementById('today-visitors').textContent = summary.todayVisitors ?? 0;

          const topPagesList = document.getElementById('top-pages-list');
          topPagesList.innerHTML = (summary.topPages || []).map((entry) => {
            return `
              <li>
                <span class="label">${entry.page}</span>
                <span class="count">${entry.count}</span>
              </li>
            `;
          }).join('') || '<li><span class="label">Žiadne dáta</span><span class="count">0</span></li>';

          const referrerList = document.getElementById('referrer-list');
          referrerList.innerHTML = (summary.referrers || []).map((entry) => {
            return `
              <li>
                <span class="label">${entry.source}</span>
                <span class="count">${entry.count}</span>
              </li>
            `;
          }).join('') || '<li><span class="label">Direct</span><span class="count">0</span></li>';

          const recentEventsList = document.getElementById('recent-events-list');
          recentEventsList.innerHTML = (summary.recent || []).map((entry) => {
            return `
              <li>
                <div>
                  <span class="label">${entry.page}</span>
                  <div class="timestamp">${entry.referrer || 'Direct'} • ${new Date(entry.timestamp).toLocaleString('sk-SK')}</div>
                </div>
                <span class="count">${entry.visitor}</span>
              </li>
            `;
          }).join('') || '<li><span class="label">Žiadne aktivity</span><span class="count">0</span></li>';
        } catch (error) {
          console.warn('Analytics dashboard failed to load', error);
        }
      }

      document.getElementById('refresh-analytics').addEventListener('click', loadAnalyticsSummary);
      loadAnalyticsSummary();
    </script>
  </body>
</html>
