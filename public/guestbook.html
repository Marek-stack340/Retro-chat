<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Oddych kniha návštev</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="page-wrap">
      <header class="guestbook-header">
        <div class="guestbook-brand-mark" aria-hidden="true"></div>
        <div class="guestbook-brand-title">Oddych Kniha návštev</div>
      </header>

      <main class="guestbook-main">
        <section class="guestbook-modern">
          <div id="entries"></div>
          <form id="guest-form" class="guestbook-form">
            <div class="guestbook-form-row">
              <label for="guest-name">Meno:</label>
              <input id="guest-name" type="text" placeholder="Tvoje meno" />
            </div>
            <div class="guestbook-form-row">
              <label for="guest-msg">Odkaz:</label>
              <input id="guest-msg" type="text" placeholder="Zanechaj odkaz..." />
            </div>
            <div class="guestbook-form-actions">
              <button id="guest-save" class="guestbook-button" type="submit">Zapísať sa</button>
            </div>
          </form>
        </section>
      </main>
    </div>

    <footer class="site-footer">
      <button id="ga-cookie-open" type="button">Google Analytics cookies</button>
    </footer>

    <div id="ga-cookie-banner" class="cookie-banner">
      <div class="cookie-content">
        <div class="cookie-copy">
          <div class="cookie-copy-header">
            <span aria-hidden="true">📊</span>
            <h3>Google Analytics cookies</h3>
          </div>
          <p>Používame Google Analytics cookies na meranie návštevnosti a zlepšovanie používateľského zážitku. Svoj súhlas môžete potvrdiť alebo zamietnuť.</p>
        </div>
        <div class="cookie-actions">
          <button type="button" class="cookie-btn accept" id="ga-cookie-accept">Prijať</button>
          <button type="button" class="cookie-btn reject" id="ga-cookie-reject">Odmietnuť</button>
        </div>
      </div>
    </div>

    <script>
      const GA_TRACKING_ID = 'G-XXXXXXXXXX';
      const GA_CONSENT_KEY = 'gaAnalyticsConsent';
      const gaCookieBanner = document.getElementById('ga-cookie-banner');
      const gaAcceptButton = document.getElementById('ga-cookie-accept');
      const gaRejectButton = document.getElementById('ga-cookie-reject');
      const gaOpenButton = document.getElementById('ga-cookie-open');

      function enableGoogleAnalytics() {
        if (window.gtag) return;

        window.dataLayer = window.dataLayer || [];
        function gtag() {
          window.dataLayer.push(arguments);
        }
        window.gtag = gtag;

        const script = document.createElement('script');
        script.async = true;
        script.src = `https://www.googletagmanager.com/gtag/js?id=${GA_TRACKING_ID}`;
        document.head.appendChild(script);

        gtag('js', new Date());
        gtag('config', GA_TRACKING_ID);
      }

      function setGoogleAnalyticsConsent(choice) {
        localStorage.setItem(GA_CONSENT_KEY, choice);

        if (choice === 'accepted') {
          enableGoogleAnalytics();
        }

        if (gaCookieBanner) {
          gaCookieBanner.hidden = true;
        }
      }

      function initializeGoogleAnalyticsConsent() {
        const consent = localStorage.getItem(GA_CONSENT_KEY);

        if (consent === 'accepted') {
          enableGoogleAnalytics();
        }

        if (gaCookieBanner) {
          gaCookieBanner.hidden = consent === 'accepted' || consent === 'rejected';
        }
      }

      gaAcceptButton?.addEventListener('click', () => setGoogleAnalyticsConsent('accepted'));
      gaRejectButton?.addEventListener('click', () => setGoogleAnalyticsConsent('rejected'));
      gaOpenButton?.addEventListener('click', () => {
        if (gaCookieBanner) gaCookieBanner.hidden = false;
      });

      initializeGoogleAnalyticsConsent();

      const entriesDiv = document.getElementById('entries');
      const nameField = document.getElementById('guest-name');
      const msgField = document.getElementById('guest-msg');
      const form = document.getElementById('guest-form');

      function loadEntries() {
        const raw = localStorage.getItem('guestbookEntries') || '[]';
        try {
          return JSON.parse(raw);
        } catch (e) {
          return [];
        }
      }

      function saveEntries(list) {
        localStorage.setItem('guestbookEntries', JSON.stringify(list));
      }

      localStorage.removeItem('guestbookEntries');

      function render() {
        const list = loadEntries();
        entriesDiv.innerHTML = '';
        if (!list.length) {
          entriesDiv.innerHTML = '<p class="panel-note">Zatiaľ žiadne zápisy.</p>';
          return;
        }
        list.slice().reverse().forEach((it) => {
          const d = document.createElement('div');
          d.className = 'panel';
          d.style.marginBottom = '12px';
          d.innerHTML = `<div><strong>${escapeHtml(it.name)}</strong> · <span style="font-size:0.9rem;color:#6a4c2f">${new Date(it.ts).toLocaleString()}</span></div><div style="margin-top:6px">${escapeHtml(it.msg)}</div>`;
          entriesDiv.appendChild(d);
        });
      }

      function escapeHtml(s) {
        return (s||'').toString().replace(/[&<>\"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
      }

      form.addEventListener('submit', (ev) => {
        ev.preventDefault();
        const name = nameField.value.trim() || localStorage.getItem('chatUsername') || 'Anon';
        const msg = msgField.value.trim();
        if (!msg) {
          alert('Napíš vlastný odkaz.');
          msgField.focus();
          return;
        }
        const list = loadEntries();
        list.push({ name, msg, ts: Date.now() });
        saveEntries(list);
        nameField.value = '';
        msgField.value = '';
        render();
        alert('Ďakujem, si v knihe návštev.');
      });

      render();
    </script>
  </body>
</html>
