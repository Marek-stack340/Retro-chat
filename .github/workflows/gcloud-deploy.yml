name: Deploy to Google Cloud Run

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/setup-gcloud@v1
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT }}

      - run: gcloud builds submit --tag gcr.io/${{ secrets.GCP_PROJECT }}/oddych-chat .

      - name: Deploy to Cloud Run
        env:
          MODERATION_PANEL_HASH: ${{ secrets.MODERATION_PANEL_HASH }}
        run: |
          if [ -z "$MODERATION_PANEL_HASH" ]; then
            echo "Missing required GitHub Actions secret: MODERATION_PANEL_HASH"
            exit 1
          fi
          gcloud run deploy oddych-chat \
            --image gcr.io/${{ secrets.GCP_PROJECT }}/oddych-chat \
            --platform managed \
            --region ${{ secrets.GCP_REGION }} \
            --allow-unauthenticated \
            --update-env-vars "MODERATION_PANEL_HASH=${MODERATION_PANEL_HASH}"
